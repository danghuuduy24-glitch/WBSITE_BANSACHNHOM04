<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--giao diện tự đổi theo thiết bị-->
    <title>Đăng ký - Thư Quán</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/header.css"> <!--liên kết với các css-->
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/dangky.css">
</head>
<!--Phần đầu trang-->
<body class="page">
<header class="page__header">
    <div class="header__topbar">
        <i class="fa fa-book header-book-icon"></i>
        <div>
            <div class="header__title">THƯ VIỆN <em>SÁCH</em></div>
            <div class="header__subtitle">Hiệu sách trực tuyến</div>
        </div>
    </div>

    <nav class="header__nav">
        <a href="index.html" class="nav__link">Trang Chủ</a>
        <a href="trangbanhang.html" class="nav__link">Sản Phẩm</a>
        <a href="giohang.html" class="nav__link">Giỏ Hàng</a>
        <a href="dathang.html" class="nav__link">Đặt Hàng</a>
        <a href="login.html" class="nav__link">Đăng Nhập</a>
        <a href="dangky.html" class="nav__link nav__link--active">Đăng Ký</a><!--liên kết trang-->
    </nav>
</header>
<!--Phần thân trang-->
<main class="page-main">
    <div class="container">
        <form id="registerForm" novalidate><!--novalidate tắt kiểm tra mặc định của HTML để java tự kiểm tra
                                            java dùng id=registerForm để lấy form-->
            <h1>Đăng ký tài khoản</h1>
            <div class="input-box">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên">
            </div>

            <div class="input-box">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Nhập email">
            </div>

            <div class="input-box">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập">
            </div>

            <div class="input-box">
                <label for="password">Mật khẩu</label>
                <div class="password-box">
                    <input type="password" id="password" placeholder="Nhập mật khẩu">
                    <button type="button" id="showPassword" aria-label="Hiện hoặc ẩn mật khẩu">👁</button>
                </div>
                <p id="strength">Độ mạnh mật khẩu: <span id="strengthText">Chưa nhập</span></p>
            </div>

            <div class="input-box">
                <label for="confirmPassword">Nhập lại mật khẩu</label>
                <input type="password" id="confirmPassword" placeholder="Nhập lại mật khẩu">
            </div>

            <div class="checkbox">
                <input type="checkbox" id="agree">
                <label for="agree">Tôi đồng ý với điều khoản sử dụng</label>
            </div>

            <button type="submit" class="btn">Đăng ký</button>

            <p class="login-link">
                Đã có tài khoản? <a href="login.html">Đăng nhập</a>
            </p>
        </form>
    </div>
</main>
<!--Phần chân trang-->
<footer class="page__footer">
        <p>© 2025 Bản quyền thuộc về Thư Viện Sách</p>
        <div class="footer-social">
            <a href="#" aria-label="Facebook"><i class="fa fa-facebook footer-icon"></i></a>
            <a href="#" aria-label="Instagram"><i class="fa fa-instagram footer-icon"></i></a>
            <a href="#" aria-label="Twitter"><i class="fa fa-twitter footer-icon"></i></a>
        </div>
    </footer>
<script src="js/register.js"></script>
</body>
</html>
