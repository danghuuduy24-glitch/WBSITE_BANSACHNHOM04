<!--Sinh viên code: Đặng Hữu Duy-->
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--giao diện tự thay đổi theo thiết bị-->
    <title>Đăng nhập - Thư viện sách</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="css/header.css"><!--liên kết với các css-->
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<!--Phần đầu trang-->
<body class="page">
<header class="page__header">
    <div class="header__topbar">
        <i class="fa fa-book header-book-icon"></i>
        <div>
            <div class="header__title">THƯ VIỆN <em>SÁCH</em></div>
            <div class="header__subtitle">Hiệu sách trực tuyến</div>
        </div>
    </div>
<!--Thanh điều hướng nav-->
    <nav class="header__nav">
        <a href="index.html" class="nav__link">Trang Chủ</a>
        <a href="trangbanhang.html" class="nav__link">Sản Phẩm</a>
        <a href="giohang.html" class="nav__link">Giỏ Hàng</a>
        <a href="dathang.html" class="nav__link">Đặt Hàng</a>
        <a href="login.html" class="nav__link nav__link--active">Đăng Nhập</a><!--liên kết link-->
        <a href="dangky.html" class="nav__link">Đăng Ký</a>
    </nav>
</header>
<!--Phần thân trang-->
<main class="page-main">
    <div class="container">
        <form id="loginForm" novalidate><!--id=loginForm để java lấy dữ liệu
                                            novalidate tắt kiểm tra mặc định của HTML để java tự kiểm tra-->
            <h1>Đăng nhập</h1>
            <div class="input-box">
                <label for="username">Tên đăng nhập</label>
                <input type="text" id="username"placeholder="Nhập tên đăng nhập"><!--id=usernameđể java lấy dữ liệu--> 
            </div>

            <div class="input-box">
                <label for="password">Mật khẩu</label> <!--mô tả-->
                <div class="password-box">
                    <input type="password" id="password" placeholder="Nhập mật khẩu">
                    <button type="button" id="showPassword" aria-label="Hiện hoặc ẩn mật khẩu">👁</button><!--nút ẩn hiện mk-->
                </div>
            </div>

            <button type="submit" class="btn">Đăng nhập</button>

            <p class="login-link">
                Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a>
            </p>
        </form>
    </div>
</main>
<!--Phần chân trang-->
<footer class="page__footer">
        <p>© 2025 Bản quyền thuộc về Thư Viện Sách</p>
        <div class="footer-social">
            <a href="#" aria-label="Facebook"><i class="fa fa-facebook footer-icon"></i></a>
            <a href="#" aria-label="Instagram"><i class="fa fa-instagram footer-icon"></i></a>
            <a href="#" aria-label="Twitter"><i class="fa fa-twitter footer-icon"></i></a>
        </div>
    </footer>
<!--liên kết với java-->
<script src="js/login.js"></script>
</body>
</html>
